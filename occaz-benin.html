<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Occaz Bénin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F3;--sf:#fff;--tx:#14201a;--mu:#5d6b63;--gr:#0B5D3B;--bt:#fff;--gr2:#E1F0E7;--ye:#F2B705;--rd:#D0342C;--ln:#dfe6e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--sf:#18221c;--tx:#eef4ef;--mu:#9bab9f;--gr:#4cc38a;--bt:#08130d;--gr2:#1c3226;--ln:#27352c}}
:root[data-theme="dark"]{--bg:#0f1713;--sf:#18221c;--tx:#eef4ef;--mu:#9bab9f;--gr:#4cc38a;--bt:#08130d;--gr2:#1c3226;--ln:#27352c}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:84px;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 16px 10px;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}
.flag{display:flex;width:26px;height:18px;border-radius:3px;overflow:hidden}
.flag i{flex:1;background:var(--gr)}.flag b{flex:1;display:flex;flex-direction:column}.flag b u{flex:1;background:var(--ye)}.flag b s{flex:1;background:var(--rd)}
.row{display:flex;gap:8px;margin-top:10px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:14px;padding:8px 14px;border-radius:20px}
.chip.on{background:var(--gr);color:var(--bt);border-color:var(--gr);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px}
.card{background:var(--sf);border-radius:12px;overflow:hidden;border:1px solid var(--ln);cursor:pointer;position:relative}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:56px;background-size:cover;background-position:center}
.card .in{padding:8px 10px 10px}
.pr{font-weight:800;font-size:17px;color:var(--gr)}
.tt{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--mu);margin-top:2px}
.heart{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--sf);font-size:17px;opacity:.95}
.empty{padding:40px 24px;text-align:center;color:var(--mu);grid-column:1/-1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{border:0;background:none;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px}
nav button span{font-size:22px}nav button.on{color:var(--gr);font-weight:600}
nav .sell{background:var(--gr);color:var(--bt);border-radius:24px;padding:10px 20px;flex-direction:row;font-weight:600;font-size:15px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:0 16px 32px;display:none;padding-top:env(safe-area-inset-top,0px)}
.sheet.open{display:block;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet.open{animation:none}}
.top{display:flex;align-items:center;gap:10px;padding:14px 0;font-weight:800;font-size:18px}
.back{border:0;background:var(--sf);border:1px solid var(--ln);color:var(--tx);width:38px;height:38px;border-radius:50%;font-size:18px}
.big{border-radius:14px;overflow:hidden}.big .ph{font-size:96px;aspect-ratio:4/3}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:600;font-size:16px;padding:14px;border-radius:12px;border:0;background:var(--gr);color:var(--bt);margin-top:10px}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.btn[disabled]{opacity:.55}
.tag{display:inline-block;background:var(--gr2);color:var(--gr);font-size:13px;padding:4px 10px;border-radius:14px;margin:4px 6px 0 0}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.note{font-size:13px;color:var(--mu);margin-top:6px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;display:none}
</style></head>
<body>
<header>
  <div class="brand"><div class="flag"><i></i><b><u></u><s></s></b></div>Occaz Bénin</div>
  <div class="row"><input id="q" type="search" placeholder="Rechercher un article" aria-label="Rechercher"><select id="city" style="max-width:140px" aria-label="Ville"></select></div>
</header>
<div class="chips" id="chips"></div>
<main><div class="grid" id="grid"></div></main>

<nav>
  <button id="nHome" class="on"><span>🏠</span>Accueil</button>
  <button class="sell" id="nSell">＋ Vendre</button>
  <button id="nFav"><span>♡</span>Favoris</button>
</nav>

<section class="sheet" id="detail" aria-label="Détail de l’annonce"></section>
<section class="sheet" id="sellForm" aria-label="Vendre un article">
  <div class="top"><button class="back" id="sBack" aria-label="Retour">←</button>Vendre un article</div>
  <label for="fPhoto">Photo</label><input id="fPhoto" type="file" accept="image/*">
  <label for="fTitle">Titre</label><input id="fTitle" maxlength="60" placeholder="Ex : Robe en pagne, taille M">
  <label for="fPrice">Prix (FCFA)</label><input id="fPrice" type="number" inputmode="numeric" min="0" placeholder="5000">
  <label for="fCat">Catégorie</label><select id="fCat"></select>
  <label for="fCity">Ville</label><select id="fCity"></select>
  <label for="fCond">État</label><select id="fCond"><option>Neuf</option><option selected>Très bon état</option><option>Bon état</option><option>À réparer</option></select>
  <label for="fDesc">Description</label><textarea id="fDesc" placeholder="Taille, couleur, défauts éventuels"></textarea>
  <label for="fPhone">Numéro WhatsApp</label><input id="fPhone" type="tel" inputmode="numeric" placeholder="01 XX XX XX XX">
  <p class="note">Les acheteurs te contactent sur WhatsApp. Ton numéro n’apparaît que sur ton annonce.</p>
  <button class="btn" id="fSave">Publier l’annonce</button>
</section>
<div id="toast" role="status"></div>

<script>
const CATS=[["Vêtements","👗",150],["Tissus","🧵",35],["Téléphones","📱",210],["Chaussures","👟",25],["Livres","📘",215],["Accessoires","👜",330],["Maison","🍰",20]];
const CITIES=["Cotonou","Abomey","Abomey-Calavi","Porto-Novo","Parakou","Bohicon","Ouidah","Natitingou"];
const SEED=[
["Pagne wax 6 yards","Tissus",8000,"Cotonou","Neuf","Pagne wax aux motifs vifs, jamais coupé.","Awa"],
["Robe en pagne, taille M","Vêtements",6500,"Abomey","Très bon état","Robe cousue main, portée une seule fois.","Rosine"],
["Tecno Spark 10","Téléphones",45000,"Cotonou","Bon état","64 Go, écran sans rayure, chargeur inclus.","Koffi"],
["Chaussures de sport, pointure 42","Chaussures",12000,"Porto-Novo","Bon état","Semelles encore solides.","Gildas"],
["Cours de mécanique générale","Livres",3500,"Abomey","Bon état","Livre pour étudiants de première année.","Maryam"],
["Sac à main en cuir","Accessoires",9000,"Parakou","Très bon état","Sac noir avec deux compartiments.","Fatou"],
["Chemise homme, taille L","Vêtements",3000,"Abomey-Calavi","Très bon état","Chemise bleue à manches longues.","Eric"],
["Moules à pâtisserie (lot de 5)","Maison",7500,"Abomey","Bon état","Moules à gâteaux et à muffins.","Carine"]
].map((s,i)=>({id:"s"+i,title:s[0],cat:s[1],price:s[2],city:s[3],cond:s[4],desc:s[5],seller:s[6],phone:"0100000000",photo:"",seed:1}));

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("fr-FR")+" FCFA";
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let mine=load("ob_items",[]),favs=load("ob_favs",[]),cat="Tout",city="Toutes",q="",tab="home";
const all=()=>[...mine,...SEED];
const catInfo=n=>CATS.find(c=>c[0]===n)||CATS[0];

function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)}
function tile(it){const c=catInfo(it.cat);return it.photo?`<div class="ph" style="background-image:url(${it.photo})"></div>`:`<div class="ph" style="background:hsl(${c[2]} 55% 88%)">${c[1]}</div>`}

function init(){
  $("city").innerHTML='<option>Toutes</option>'+CITIES.map(c=>`<option>${c}</option>`).join("");
  $("fCity").innerHTML=CITIES.map(c=>`<option>${c}</option>`).join("");
  $("fCat").innerHTML=CATS.map(c=>`<option>${c[0]}</option>`).join("");
  $("chips").innerHTML=["Tout",...CATS.map(c=>c[0])].map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("");
  $("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;init();render()};
  $("q").oninput=e=>{q=e.target.value.toLowerCase();render()};
  $("city").onchange=e=>{city=e.target.value;render()};
}
function render(){
  let list=all();
  if(tab==="fav")list=list.filter(i=>favs.includes(i.id));
  if(cat!=="Tout")list=list.filter(i=>i.cat===cat);
  if(city!=="Toutes")list=list.filter(i=>i.city===city);
  if(q)list=list.filter(i=>(i.title+" "+i.desc).toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(i=>`<div class="card" data-id="${i.id}">${tile(i)}<button class="heart" data-f="${i.id}" aria-label="Favori">${favs.includes(i.id)?"♥":"♡"}</button><div class="in"><div class="pr">${fmt(i.price)}</div><div class="tt">${esc(i.title)}</div><div class="mt">${esc(i.city)} · ${esc(i.cond)}</div></div></div>`).join(""):`<div class="empty">${tab==="fav"?"Aucun favori. Touche le cœur d’une annonce pour la garder ici.":"Aucune annonce trouvée. Change de catégorie ou de ville, ou publie la première."}</div>`;
}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save("ob_favs",favs);render();if($("detail").classList.contains("open"))openDetail(id)}
$("grid").onclick=e=>{const h=e.target.closest(".heart");if(h){e.stopPropagation();toggleFav(h.dataset.f);return}const c=e.target.closest(".card");if(c)openDetail(c.dataset.id)};

function openDetail(id){
  const i=all().find(x=>x.id===id);if(!i)return;
  const ph=String(i.phone).replace(/\D/g,"");const num=ph.length===10?"229"+ph:ph;
  const msg=encodeURIComponent(`Bonjour, votre annonce « ${i.title} » à ${fmt(i.price)} est-elle toujours disponible ?`);
  $("detail").innerHTML=`<div class="top"><button class="back" id="dBack" aria-label="Retour">←</button>Annonce</div>
  <div class="big">${tile(i)}</div>
  <div class="pr" style="font-size:26px;margin-top:14px">${fmt(i.price)}</div>
  <h1 style="font-size:20px;margin-top:4px">${esc(i.title)}</h1>
  <div style="margin-top:8px"><span class="tag">${esc(i.cat)}</span><span class="tag">${esc(i.cond)}</span><span class="tag">📍 ${esc(i.city)}</span></div>
  <p style="margin-top:14px;line-height:1.5">${esc(i.desc||"Pas de description.")}</p>
  <p class="note">Vendu par ${esc(i.seller||"un membre")}</p>
  <a class="btn" href="https://wa.me/${num}?text=${msg}" target="_blank" rel="noopener">Contacter sur WhatsApp</a>
  <button class="btn alt" id="dFav">${favs.includes(i.id)?"♥ Retirer des favoris":"♡ Ajouter aux favoris"}</button>
  <button class="btn alt" disabled>Payer par Mobile Money (bientôt)</button>
  ${i.seed?'<p class="note">Annonce d’exemple : le numéro est fictif.</p>':'<button class="btn alt" id="dDel">Supprimer mon annonce</button>'}
  <p class="note">Conseil : rencontre le vendeur dans un lieu public et vérifie l’article avant de payer.</p>`;
  $("detail").classList.add("open");$("detail").scrollTop=0;
  $("dBack").onclick=()=>$("detail").classList.remove("open");
  $("dFav").onclick=()=>toggleFav(i.id);
  const d=$("dDel");if(d)d.onclick=()=>{mine=mine.filter(x=>x.id!==i.id);save("ob_items",mine);$("detail").classList.remove("open");render();toast("Annonce supprimée")};
}

let photo="";
$("fPhoto").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.7)};im.src=r.result};
  r.readAsDataURL(f);
};
$("nSell").onclick=()=>{$("sellForm").classList.add("open");$("sellForm").scrollTop=0};
$("sBack").onclick=()=>$("sellForm").classList.remove("open");
$("fSave").onclick=()=>{
  const t=$("fTitle").value.trim(),p=Number($("fPrice").value),ph=$("fPhone").value.replace(/\D/g,"");
  if(!t)return toast("Ajoute un titre");
  if(!(p>0))return toast("Indique un prix en FCFA");
  if(ph.length!==10)return toast("Le numéro doit avoir 10 chiffres");
  const it={id:"u"+Date.now(),title:t,cat:$("fCat").value,price:p,city:$("fCity").value,cond:$("fCond").value,desc:$("fDesc").value.trim(),seller:"Moi",phone:ph,photo};
  mine=[it,...mine];
  if(!save("ob_items",mine)){it.photo="";save("ob_items",mine);toast("Annonce publiée sans photo (mémoire pleine)")}else toast("Annonce publiée");
  ["fTitle","fPrice","fDesc","fPhone","fPhoto"].forEach(k=>$(k).value="");photo="";
  $("sellForm").classList.remove("open");tab="home";setNav();render();
};
function setNav(){$("nHome").classList.toggle("on",tab==="home");$("nFav").classList.toggle("on",tab==="fav")}
$("nHome").onclick=()=>{tab="home";setNav();render()};
$("nFav").onclick=()=>{tab="fav";setNav();render()};
init();render();
</script>
</body></html>
